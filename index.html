<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Image Compressor</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🖼 Matrix Image Compressor</h1>
    <p class="subtitle">
        Compress JPG, PNG and WebP images directly on your device.
        Nothing is uploaded to any server.
    </p>

    <div class="upload-box" id="dropArea">

        <input
            type="file"
            id="imageInput"
            accept="image/jpeg,image/png,image/webp"
            hidden>

        <button id="browseBtn">
            Select Image
        </button>

        <p>or drag & drop here</p>

        <small>Maximum File Size: 50 MB</small>

    </div>

    <div class="preview-section" id="previewSection">

        <h2>Preview</h2>

        <img id="previewImage">

        <div class="fileInfo">

            <p>
                <strong>File:</strong>
                <span id="fileName">-</span>
            </p>

            <p>
                <strong>Original Size:</strong>
                <span id="originalSize">-</span>
            </p>

            <p>
                <strong>Compressed Size:</strong>
                <span id="compressedSize">-</span>
            </p>

            <p>
                <strong>Saved:</strong>
                <span id="savedPercent">-</span>
            </p>

        </div>

    </div>

    <div class="controls">

        <label>
            Quality
        </label>

        <input
            type="range"
            id="quality"
            min="10"
            max="100"
            value="80">

        <span id="qualityValue">80%</span>

        <br><br>

        <label>
            Resize Width (optional)
        </label>

        <input
            type="number"
            id="resizeWidth"
            placeholder="Original">

        <br><br>

        <button id="compressBtn">
            Compress Image
        </button>

        <a
            id="downloadBtn"
            download="compressed-image.jpg">

            Download Image

        </a>

    </div>

</div>

<script src="compressor.js"></script>
<script src="script.js"></script>

</body>
</html>
